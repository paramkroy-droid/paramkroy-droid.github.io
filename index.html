<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Attendance Tracker</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Attendance">

  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; background-color: #02040a; color: #f8fafc; overflow-x: hidden; min-height: 100vh; }
    .bg-mesh { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .bg-orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.6; animation: floatOrb 18s ease-in-out infinite alternate; }
    .bg-orb-1 { top: -10%; left: -10%; width: 65vw; height: 65vw; background: radial-gradient(circle, rgba(99, 102, 241, 0.35) 0%, rgba(139, 92, 246, 0.15) 70%, transparent 100%); }
    .bg-orb-2 { top: 40%; right: -15%; width: 60vw; height: 60vw; background: radial-gradient(circle, rgba(236, 72, 153, 0.28) 0%, rgba(168, 85, 247, 0.1) 70%, transparent 100%); animation-delay: -6s; }
    .bg-orb-3 { bottom: -10%; left: 20%; width: 70vw; height: 70vw; background: radial-gradient(circle, rgba(6, 182, 212, 0.25) 0%, rgba(59, 130, 246, 0.1) 70%, transparent 100%); animation-delay: -12s; }
    @keyframes floatOrb { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(30px, 20px) scale(1.05); } 100% { transform: translate(-20px, 30px) scale(0.95); } }
    .glass-card { background: rgba(255, 255, 255, 0.035); backdrop-filter: blur(45px) saturate(190%); -webkit-backdrop-filter: blur(45px) saturate(190%); border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6), inset 0 1px 1px 0 rgba(255, 255, 255, 0.25), inset 0 -1px 1px 0 rgba(0, 0, 0, 0.4); }
    .glass-modal { background: rgba(10, 15, 30, 0.88); backdrop-filter: blur(60px) saturate(200%); -webkit-backdrop-filter: blur(60px) saturate(200%); border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 40px 80px rgba(0, 0, 0, 0.85); }
    .glass-input { background: rgba(2, 6, 23, 0.45); border: 1px solid rgba(255, 255, 255, 0.12); color: #f8fafc; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-sizing: border-box; font-size: 14px; }
    .glass-input:focus { background: rgba(2, 6, 23, 0.75); border-color: rgba(129, 140, 248, 0.8); box-shadow: 0 0 25px -5px rgba(99, 102, 241, 0.4); outline: none; }
    .liquid-bar-track { background: rgba(0, 0, 0, 0.65); border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.8); position: relative; }
    .liquid-bar-fill { position: relative; overflow: hidden; box-shadow: 0 0 15px rgba(255, 255, 255, 0.2), inset 0 1px 2px rgba(255, 255, 255, 0.6), inset 0 -1px 2px rgba(0, 0, 0, 0.4); transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
    .liquid-bar-fill::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 45%; background: linear-gradient(to bottom, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.05)); border-radius: 9999px 9999px 0 0; }
    .glow-button { position: relative; background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .glow-button::after { content: ''; position: absolute; inset: -2px; background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); border-radius: inherit; filter: blur(14px); opacity: 0; z-index: -1; transition: opacity 0.3s ease; }
    .glow-button:hover::after { opacity: 0.75; }
    .glow-button:active { transform: scale(0.98); }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #020617; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.18); border-radius: 9999px; }
  </style>
</head>
<body class="selection:bg-indigo-500 selection:text-white">
  <div class="bg-mesh">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>
  </div>
  <div id="root" class="relative z-10"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const GOOGLE_CLIENT_ID = "198897421694-94kplkn16lqgck3sohde39apfhdlpr25.apps.googleusercontent.com";
    const SCOPES = "https://www.googleapis.com/auth/drive.appdata";
    const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const DEFAULT_COLORS = ['#6366f1', '#ec4899', '#10b981', '#f59e0b', '#06b6d4', '#8b5cf6', '#f43f5e', '#14b8a6'];

    const toLocalDateKey = (dateInput = new Date()) => {
      const d = new Date(dateInput);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    const GEMINI_TOOLS = [{
      functionDeclarations: [
        {
          name: "addSubject",
          description: "Adds a new subject to the tracker.",
          parameters: { type: "OBJECT", properties: { name: { type: "STRING" }, min: { type: "NUMBER" }, target: { type: "NUMBER" }, attended: { type: "NUMBER" }, total: { type: "NUMBER" } }, required: ["name"] }
        },
        {
          name: "deleteSubject",
          description: "Deletes a subject and its schedules by subject name or ID.",
          parameters: { type: "OBJECT", properties: { subjectNameOrId: { type: "STRING" } }, required: ["subjectNameOrId"] }
        },
        {
          name: "addSchedule",
          description: "Adds a permanent or temporary lecture schedule slot for a subject.",
          parameters: { type: "OBJECT", properties: { subjectNameOrId: { type: "STRING" }, day: { type: "STRING" }, type: { type: "STRING" }, startTime: { type: "STRING" }, endTime: { type: "STRING" }, isTemporary: { type: "BOOLEAN" }, startDate: { type: "STRING" }, endDate: { type: "STRING" } }, required: ["subjectNameOrId", "day", "startTime", "endTime"] }
        },
        {
          name: "deleteSchedule",
          description: "Deletes an existing schedule slot based on subject name and optional day or time.",
          parameters: { type: "OBJECT", properties: { subjectNameOrId: { type: "STRING" }, day: { type: "STRING" }, startTime: { type: "STRING" } }, required: ["subjectNameOrId"] }
        },
        {
          name: "updateSchedule",
          description: "Modifies or updates an existing schedule slot's time, type, or day.",
          parameters: { type: "OBJECT", properties: { subjectNameOrId: { type: "STRING" }, day: { type: "STRING" }, newDay: { type: "STRING" }, newStartTime: { type: "STRING" }, newEndTime: { type: "STRING" }, newType: { type: "STRING" } }, required: ["subjectNameOrId"] }
        }
      ]
    }];

    function App() {
      const [subjects, setSubjects] = useState([]);
      const [timetable, setTimetable] = useState([]);
      const [historyLogs, setHistoryLogs] = useState({});
      const [holidays, setHolidays] = useState([]);
      const [cancelledSingleSlots, setCancelledSingleSlots] = useState({});
      
      const [activeTab, setActiveTab] = useState('tracker');
      const [calendarViewMode, setCalendarViewMode] = useState('monthly');
      const [loaded, setLoaded] = useState(false);
      const [notifState, setNotifState] = useState('unknown');

      const [accessToken, setAccessToken] = useState(null);
      const [syncing, setSyncing] = useState(false);
      const tokenClientRef = useRef(null);
      const triggeredAlerts = useRef(new Set());

      const [geminiApiKey, setGeminiApiKey] = useState('');
      const [aiInput, setAiInput] = useState('');
      const [chatMessages, setChatMessages] = useState([]);
      const [isAiLoading, setIsAiLoading] = useState(false);
      const [showAiAdvisor, setShowAiAdvisor] = useState(false);
      const chatEndRef = useRef(null);

      const [currentMonth, setCurrentMonth] = useState(new Date());
      const [selectedCalendarDay, setSelectedCalendarDay] = useState(null);
      const [dailyInspectorDate, setDailyInspectorDate] = useState(new Date());
      const [alertLeadTime, setAlertLeadTime] = useState(10);

      const [name, setName] = useState('');
      const [min, setMin] = useState('75');
      const [target, setTarget] = useState('85');
      const [attended, setAttended] = useState('0');
      const [total, setTotal] = useState('0');
      const [selectedColor, setSelectedColor] = useState(DEFAULT_COLORS[0]);

      const [ttDay, setTtDay] = useState('Monday');
      const [ttSubjectId, setTtSubjectId] = useState('');
      const [ttType, setTtType] = useState('Lecture');
      const [ttStartTime, setTtStartTime] = useState('09:00');
      const [ttEndTime, setTtEndTime] = useState('10:00');
      const [ttIsTemporary, setTtIsTemporary] = useState(false);
      const [ttStartDate, setTtStartDate] = useState(() => toLocalDateKey());
      const [ttEndDate, setTtEndDate] = useState(() => toLocalDateKey());
      const [holidayName, setHolidayName] = useState('');
      const [holidayStartDate, setHolidayStartDate] = useState(() => toLocalDateKey());
      const [holidayEndDate, setHolidayEndDate] = useState(() => toLocalDateKey());

      const loadFromGoogleDrive = useCallback(async (token) => {
        setSyncing(true);
        try {
          const queryRes = await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='attendance_data.json'", {
            headers: { Authorization: `Bearer ${token}` }
          });
          const queryData = await queryRes.json();
          if (queryData.files?.length > 0) {
            const contentRes = await fetch(`https://www.googleapis.com/drive/v3/files/${queryData.files[0].id}?alt=media`, { headers: { Authorization: `Bearer ${token}` } });
            const cloudData = await contentRes.json();
            if (cloudData.subjects) setSubjects(cloudData.subjects);
            if (cloudData.timetable) setTimetable(cloudData.timetable);
            if (cloudData.historyLogs) setHistoryLogs(cloudData.historyLogs);
            if (cloudData.holidays) setHolidays(cloudData.holidays);
            if (cloudData.cancelledSingleSlots) setCancelledSingleSlots(cloudData.cancelledSingleSlots);
          }
        } catch (err) { console.error("Drive error:", err); } 
        finally { setSyncing(false); }
      }, []);

      const saveToGoogleDrive = useCallback(async (token, cSubj, cTime, cHist, cHol, cCanc) => {
        setSyncing(true);
        try {
          const payload = JSON.stringify({ subjects: cSubj, timetable: cTime, historyLogs: cHist, holidays: cHol, cancelledSingleSlots: cCanc });
          const queryRes = await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='attendance_data.json'", { headers: { Authorization: `Bearer ${token}` } });
          const queryData = await queryRes.json();
          let fileId = queryData.files?.length > 0 ? queryData.files[0].id : null;
          
          const metadata = { name: 'attendance_data.json', mimeType: 'application/json', ...(fileId ? {} : { parents: ['appDataFolder'] }) };
          const form = new FormData();
          form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
          form.append('file', new Blob([payload], { type: 'application/json' }));

          const endpoint = fileId ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart` : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
          await fetch(endpoint, { method: fileId ? 'PATCH' : 'POST', headers: { Authorization: `Bearer ${token}` }, body: form });
        } catch (err) { console.error("Save error:", err); } 
        finally { setSyncing(false); }
      }, []);

      useEffect(() => {
        try {
          const savedSubjects = localStorage.getItem('attendance_subjects_v18');
          const savedTimetable = localStorage.getItem('attendance_timetable_v18');
          const savedHistory = localStorage.getItem('attendance_history_v18');
          const savedHolidays = localStorage.getItem('attendance_holidays_v18');
          const savedCancelledSlots = localStorage.getItem('attendance_cancelled_single_v18');
          const savedLeadTime = localStorage.getItem('attendance_alert_lead_time');
          const savedApiKey = localStorage.getItem('gemini_api_key_v1');
          
          if (savedSubjects) setSubjects(JSON.parse(savedSubjects));
          if (savedTimetable) setTimetable(JSON.parse(savedTimetable));
          if (savedHistory) setHistoryLogs(JSON.parse(savedHistory));
          if (savedHolidays) setHolidays(JSON.parse(savedHolidays));
          if (savedCancelledSlots) setCancelledSingleSlots(JSON.parse(savedCancelledSlots));
          if (savedLeadTime) setAlertLeadTime(parseInt(savedLeadTime, 10));
          if (savedApiKey) setGeminiApiKey(savedApiKey);
        } catch (e) { console.error(e); }

        setNotifState('Notification' in window ? Notification.permission : 'unsupported');
        setLoaded(true);

        let attempts = 0;
        const checkGoogleLibs = setInterval(() => {
          attempts++;
          if (window.google && window.google.accounts) {
            clearInterval(checkGoogleLibs);
            tokenClientRef.current = window.google.accounts.oauth2.initTokenClient({
              client_id: GOOGLE_CLIENT_ID,
              scope: SCOPES,
              callback: async (resp) => {
                if (resp.access_token) {
                  setAccessToken(resp.access_token);
                  localStorage.setItem('has_authorized_drive', 'true');
                  await loadFromGoogleDrive(resp.access_token);
                }
              },
            });
            if (localStorage.getItem('has_authorized_drive') === 'true') {
              try { tokenClientRef.current.requestAccessToken({ prompt: '' }); } catch (e) { }
            }
          } else if (attempts > 50) {
            clearInterval(checkGoogleLibs);
          }
        }, 300);
        return () => clearInterval(checkGoogleLibs);
      }, [loadFromGoogleDrive]);

      useEffect(() => {
        const handleBeforeUnload = (e) => {
          if (syncing) {
            e.preventDefault();
            e.returnValue = '';
          }
        };
        window.addEventListener('beforeunload', handleBeforeUnload);
        return () => window.removeEventListener('beforeunload', handleBeforeUnload);
      }, [syncing]);

      useEffect(() => {
        if (!loaded) return;
        localStorage.setItem('attendance_subjects_v18', JSON.stringify(subjects));
        localStorage.setItem('attendance_timetable_v18', JSON.stringify(timetable));
        localStorage.setItem('attendance_history_v18', JSON.stringify(historyLogs));
        localStorage.setItem('attendance_holidays_v18', JSON.stringify(holidays));
        localStorage.setItem('attendance_cancelled_single_v18', JSON.stringify(cancelledSingleSlots));
        localStorage.setItem('attendance_alert_lead_time', alertLeadTime.toString());
        localStorage.setItem('gemini_api_key_v1', geminiApiKey);

        if (accessToken) {
            const timeout = setTimeout(() => {
                saveToGoogleDrive(accessToken, subjects, timetable, historyLogs, holidays, cancelledSingleSlots);
            }, 2000);
            return () => clearTimeout(timeout);
        }
      }, [subjects, timetable, historyLogs, holidays, cancelledSingleSlots, alertLeadTime, geminiApiKey, loaded, accessToken, saveToGoogleDrive]);

      useEffect(() => {
        if (chatEndRef.current) chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
      }, [chatMessages, isAiLoading]);

      const handleGoogleLogin = () => {
        if (!tokenClientRef.current) return alert("Google Sign-In service is initializing.");
        tokenClientRef.current.requestAccessToken({ prompt: 'consent' });
      };

      const executeAddSubject = (args) => {
        const subName = args.name?.trim();
        if (!subName) return "Failed: Name required.";
        const att = Math.max(0, parseInt(args.attended) || 0);
        const tot = Math.max(0, parseInt(args.total) || 0);
        const minPct = parseFloat(args.min) || 75;
        const targetPct = parseFloat(args.target) || 85;
        if (att > tot) return "Failed: Attended > Total.";
        
        setSubjects(prev => [...prev, { id: Date.now().toString(), name: subName, attended: att, total: tot, min: minPct, target: targetPct, color: DEFAULT_COLORS[prev.length % DEFAULT_COLORS.length], createdAt: toLocalDateKey() }]);
        return `Added subject '${subName}'.`;
      };

      const executeDeleteSubject = (args) => {
        const query = args.subjectNameOrId?.trim().toLowerCase();
        let targetSub = subjects.find(s => s.id === query || s.name.toLowerCase() === query);
        if (!targetSub) return `Failed: Subject not found.`;
        setSubjects(prev => prev.filter(s => s.id !== targetSub.id));
        setTimetable(prev => prev.filter(t => t.subjectId !== targetSub.id));
        return `Deleted subject '${targetSub.name}'.`;
      };

      const executeAddSchedule = (args) => {
        const subQuery = args.subjectNameOrId?.trim().toLowerCase();
        const targetSub = subjects.find(s => s.id === subQuery || s.name.toLowerCase() === subQuery);
        if (!targetSub) return `Failed: Subject not found.`;
        const dayName = args.day ? args.day.charAt(0).toUpperCase() + args.day.slice(1).toLowerCase() : 'Monday';
        const isTemp = !!args.isTemporary;
        const startDate = args.startDate || toLocalDateKey();
        
        setTimetable(prev => [...prev, {
          id: Date.now().toString(), day: dayName, subjectId: targetSub.id, type: args.type === 'Practical' ? 'Practical' : 'Lecture',
          startTime: args.startTime || '09:00', endTime: args.endTime || '10:00',
          isTemporary: isTemp, startDate: isTemp ? startDate : null, endDate: isTemp ? (args.endDate || startDate) : null
        }]);
        return `Scheduled class for '${targetSub.name}' on ${dayName}.`;
      };

      const executeDeleteSchedule = (args) => {
        const subQuery = args.subjectNameOrId?.trim().toLowerCase();
        const targetSub = subjects.find(s => s.id === subQuery || s.name.toLowerCase() === subQuery);
        if (!targetSub) return `Failed: Subject not found.`;
        const targetDay = args.day ? args.day.charAt(0).toUpperCase() + args.day.slice(1).toLowerCase() : null;
        const targetTime = args.startTime?.trim();

        setTimetable(prev => prev.filter(t => {
          if (t.subjectId !== targetSub.id) return true;
          if (targetDay && t.day !== targetDay) return true;
          if (targetTime && t.startTime !== targetTime) return true;
          return false;
        }));
        return `Deleted matching schedules for '${targetSub.name}'.`;
      };

      const executeUpdateSchedule = (args) => {
        const subQuery = args.subjectNameOrId?.trim().toLowerCase();
        const targetSub = subjects.find(s => s.id === subQuery || s.name.toLowerCase() === subQuery);
        if (!targetSub) return `Failed: Subject not found.`;
        const filterDay = args.day ? args.day.charAt(0).toUpperCase() + args.day.slice(1).toLowerCase() : null;
        let updatedCount = 0;
        
        setTimetable(prev => prev.map(t => {
          if (t.subjectId !== targetSub.id || (filterDay && t.day !== filterDay)) return t;
          updatedCount++;
          return {
            ...t,
            day: args.newDay ? (args.newDay.charAt(0).toUpperCase() + args.newDay.slice(1).toLowerCase()) : t.day,
            startTime: args.newStartTime || t.startTime,
            endTime: args.newEndTime || t.endTime,
            type: args.newType || t.type
          };
        }));
        return `Updated ${updatedCount} schedule(s) for '${targetSub.name}'.`;
      };

      const handleAskGemini = async (e) => {
        e.preventDefault();
        if (!aiInput.trim() || !geminiApiKey.trim()) return;

        setChatMessages(prev => [...prev, { sender: 'user', text: aiInput.trim(), timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }]);
        setAiInput('');
        setIsAiLoading(true);

        try {
          // Note: The endpoint below has been updated to use gemini-3.6-flash
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${geminiApiKey.trim()}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: `System Context: Subjects: ${JSON.stringify(subjects)}, Timetable: ${JSON.stringify(timetable)}. User: "${aiInput.trim()}"` }] }],
              tools: GEMINI_TOOLS
            })
          });

          const data = await res.json();
          let botReply = '';
          if (data.candidates?.[0]?.content?.parts) {
            let logs = [];
            for (const part of data.candidates[0].content.parts) {
              if (part.text) botReply += part.text + ' ';
              if (part.functionCall) {
                const call = part.functionCall;
                let result = '';
                if (call.name === 'addSubject') result = executeAddSubject(call.args);
                else if (call.name === 'deleteSubject') result = executeDeleteSubject(call.args);
                else if (call.name === 'addSchedule') result = executeAddSchedule(call.args);
                else if (call.name === 'deleteSchedule') result = executeDeleteSchedule(call.args);
                else if (call.name === 'updateSchedule') result = executeUpdateSchedule(call.args);
                logs.push(`⚙️ Executed ${call.name}: ${result}`);
              }
            }
            if (logs.length > 0) botReply = `${logs.join('\n')}\n\n${botReply}`.trim();
          } else botReply = data.error?.message || 'Error parsing AI response.';

          setChatMessages(prev => [...prev, { sender: 'ai', text: botReply || 'Done.', timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }]);
        } catch (err) {
          setChatMessages(prev => [...prev, { sender: 'ai', text: `Error: ${err.message}`, timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }]);
        } finally {
          setIsAiLoading(false);
        }
      };

      const isDateHoliday = (dateStr) => holidays.find(h => dateStr >= h.startDate && dateStr <= h.endDate);
      const isSlotActiveOnDate = (slot, dateStr) => slot.isTemporary ? (slot.startDate && dateStr >= slot.startDate && slot.endDate && dateStr <= slot.endDate) : true;

      useEffect(() => {
        if (notifState !== 'granted' || timetable.length === 0) return;
        const interval = setInterval(() => {
          const now = new Date();
          const dateStr = toLocalDateKey(now);
          if (isDateHoliday(dateStr)) return;
          const dayName = DAYS[now.getDay()];
          const currentMinutes = now.getHours() * 60 + now.getMinutes();

          timetable.forEach(slot => {
            if (slot.day !== dayName || !isSlotActiveOnDate(slot, dateStr) || cancelledSingleSlots[dateStr]?.includes(slot.id)) return;
            const [h, m] = slot.startTime.split(':').map(Number);
            const alertKey = `${dateStr}-${slot.id}`;
            const timeDiff = (h * 60 + m) - currentMinutes;
            
            if (timeDiff > 0 && timeDiff <= alertLeadTime && !triggeredAlerts.current.has(alertKey)) {
              const subject = subjects.find(s => s.id === slot.subjectId);
              if (subject) {
                try {
                  const notification = new Notification(`Class Alert: ${subject.name}`, { body: `${slot.type} starts in ${timeDiff} mins (${slot.startTime}).` });
                  notification.onclick = () => window.focus();
                  triggeredAlerts.current.add(alertKey);
                } catch (err) {}
              }
            }
          });
        }, 10000);
        return () => clearInterval(interval);
      }, [notifState, timetable, subjects, holidays, cancelledSingleSlots, alertLeadTime]);

      const addSubject = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        const att = Math.max(0, parseInt(attended) || 0), tot = Math.max(0, parseInt(total) || 0);
        const minPct = parseFloat(min) || 75, targetPct = parseFloat(target) || 85;
        if (att > tot || minPct > targetPct || minPct < 0 || targetPct > 100) return alert("Invalid metrics.");
        
        setSubjects([...subjects, { id: Date.now().toString(), name: name.trim(), attended: att, total: tot, min: minPct, target: targetPct, color: selectedColor, createdAt: toLocalDateKey() }]);
        setName(''); setAttended('0'); setTotal('0');
        setSelectedColor(DEFAULT_COLORS[(subjects.length + 1) % DEFAULT_COLORS.length]);
      };

      const updateTargetMetric = (id, field, value) => {
        const val = parseFloat(value) || 0;
        if (val < 0 || val > 100) return;
        setSubjects(subjects.map(s => {
          if (s.id !== id) return s;
          const updated = { ...s, [field]: val };
          if (updated.min > updated.target) field === 'min' ? updated.target = updated.min : updated.min = updated.target;
          return updated;
        }));
      };

      const logStatus = (subjectId, action, targetDate) => {
        const dateKey = targetDate ? toLocalDateKey(targetDate) : toLocalDateKey();
        setSubjects(subjects.map(s => {
          if (s.id !== subjectId) return s;
          let att = s.attended, tot = s.total;
          if (action === 'attended') { att++; tot++; } else if (action === 'missed') { tot++; } else if (action === 'cancelled' && tot > 0) { tot--; if (att > tot) att = tot; }
          return { ...s, attended: Math.max(0, att), total: Math.max(0, tot) };
        }));

        setHistoryLogs(prev => {
          const dayRecords = prev[dateKey] ? [...prev[dateKey]] : [];
          const idx = dayRecords.findIndex(r => r.subjectId === subjectId);
          if (idx >= 0) dayRecords[idx] = { subjectId, status: action };
          else dayRecords.push({ subjectId, status: action });
          
          const updatedLogs = { ...prev, [dateKey]: dayRecords };
          
          // Prune history older than 90 days to prevent overflow
          const keys = Object.keys(updatedLogs).sort();
          if (keys.length > 90) {
            keys.slice(0, keys.length - 90).forEach(k => delete updatedLogs[k]);
          }
          return updatedLogs;
        });
      };

          const updatedCancelled = { ...prev, [dateKey]: [...(prev[dateKey] || []), slotId] };

          const keys = Object.keys(updatedCancelled).sort();
          if (keys.length > 90) {
            keys.slice(0, keys.length - 90).forEach(k => delete updatedCancelled[k]);

                              <div className="absolute top-0 bottom-0 w-0.5 bg-rose-500 z-10" style={{ left: `${Math.min(s.min, 100)}%` }}></div>

                        const dateKey = toLocalDateKey(dailyInspectorDate);
                        const dayStr = DAYS[dailyInspectorDate.getDay()];
                        const hol = isDateHoliday(dateKey);
                        const daySlots = timetable.filter(t => t.day === dayStr && isSlotActiveOnDate(t, dateKey) && !(cancelledSingleSlots[dateKey] || []).includes(t.id));
                        if (hol) return (
                          <div className="text-center py-6 bg-amber-500/10 border border-amber-500/20 rounded-2xl space-y-1">
                            <p className="text-amber-300 font-bold text-xs">🎉 {hol.name}</p>
                            <p className="text-amber-400/80 text-[11px]">Holiday Range: {hol.startDate} to {hol.endDate}</p>
                            <p className="text-slate-400 text-[11px] pt-0.5">All scheduled lectures cancelled.</p>
                          </div>
                        );
                        if (daySlots.length === 0) return <div className="text-center py-6 text-slate-500 text-xs font-medium">No active classes scheduled.</div>;
                        
                        return (
                          <div className="space-y-2.5">
                            {daySlots.map(slot => {
                              const sub = subjects.find(s => s.id === slot.subjectId);
                              if (!sub) return null;
                              return (
                                <div key={slot.id} className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border border-white/10 rounded-2xl p-3 shadow-md" style={{ borderLeftWidth: '5px', borderLeftColor: sub.color || '#6366f1', backgroundColor: 'rgba(255,255,255,0.02)' }}>
                                  <div>
                                    <div className="flex items-center gap-1.5">
                                      <span className="font-bold text-slate-100 text-sm">{sub.name}</span>
                                      <span className={`px-2 py-0.5 text-[8px] font-extrabold uppercase rounded-full ${slot.type === 'Practical' ? 'bg-purple-500/20 text-purple-300 border border-purple-500/30' : 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/30'}`}>{slot.type}</span>
                                      {slot.isTemporary && <span className="px-2 py-0.5 text-[8px] font-extrabold uppercase rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">Temporary</span>}
                                    </div>
                                    <p className="text-[11px] font-medium text-slate-400 mt-0.5">🕒 {slot.startTime} – {slot.endTime}</p>
                                  </div>
                                  <div className="flex items-center gap-1.5 flex-wrap">
                                    <button onClick={() => logStatus(sub.id, 'attended', dailyInspectorDate)} className="px-2.5 py-1 rounded-xl bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-[11px] font-bold">✓ Attended</button>
                                    <button onClick={() => logStatus(sub.id, 'missed', dailyInspectorDate)} className="px-2.5 py-1 rounded-xl bg-rose-500/20 border border-rose-500/40 text-rose-300 text-[11px] font-bold">✕ Missed</button>
                                    <button onClick={() => cancelSlotForSpecificDay(slot.id, dailyInspectorDate)} className="px-2.5 py-1 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-[11px] font-bold">🗑️ Day Cancel</button>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        )
                      })()}
                    </div>
                  )}
                </div>

                {selectedCalendarDay && calendarViewMode === 'monthly' && (
                  <div className="fixed inset-0 z-50 flex items-center justify-center p-3 bg-black/60 backdrop-blur-sm">
                    <div className="glass-modal w-full max-w-md rounded-3xl p-5 space-y-4">
                      <div className="flex items-center justify-between border-b border-white/10 pb-2.5">
                        <div>
                          <h3 className="text-sm font-bold text-white">{selectedCalendarDay.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' })}</h3>
                          <p className="text-[11px] text-slate-400">Scheduled lectures & practicals</p>
                        </div>
                        <button onClick={() => setSelectedCalendarDay(null)} className="px-2.5 py-1 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-bold text-slate-300">✕</button>
                      </div>
                      
                      {(() => {
                        const dateKey = toLocalDateKey(selectedCalendarDay);
                        const dayStr = DAYS[selectedCalendarDay.getDay()];
                        const hol = isDateHoliday(dateKey);
                        const daySlots = timetable.filter(t => t.day === dayStr && isSlotActiveOnDate(t, dateKey) && !(cancelledSingleSlots[dateKey] || []).includes(t.id));
                        if (hol) return (
                          <div className="text-center py-5 bg-amber-500/10 border border-amber-500/20 rounded-2xl space-y-1">
                            <p className="text-amber-300 font-bold text-xs">🎉 {hol.name}</p>
                            <p className="text-amber-400/80 text-[11px]">Holiday Range: {hol.startDate} to {hol.endDate}</p>
                          </div>
                        );
                        if (daySlots.length === 0) return <p className="text-center py-5 text-slate-400 text-xs font-medium">No classes scheduled.</p>;
                        
                        return (
                          <div className="space-y-2.5 max-h-72 overflow-y-auto pr-1">
                            {daySlots.map(slot => {
                              const sub = subjects.find(s => s.id === slot.subjectId);
                              if (!sub) return null;
                              return (
                                <div key={slot.id} className="flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 border border-white/10 rounded-2xl p-3" style={{ borderLeftWidth: '4px', borderLeftColor: sub.color || '#6366f1', backgroundColor: 'rgba(255,255,255,0.02)' }}>
                                  <div>
                                    <div className="flex items-center gap-1.5">
                                      <span className="font-bold text-slate-100 text-xs">{sub.name}</span>
                                      <span className={`px-1.5 py-0.2 text-[8px] font-extrabold uppercase rounded-full ${slot.type === 'Practical' ? 'bg-purple-500/20 text-purple-300 border border-purple-500/30' : 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/30'}`}>{slot.type}</span>
                                      {slot.isTemporary && <span className="px-1.5 py-0.2 text-[8px] font-extrabold uppercase rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">Temp</span>}
                                    </div>
                                    <p className="text-[10px] font-medium text-slate-400 mt-0.5">🕒 {slot.startTime} – {slot.endTime}</p>
                                  </div>
                                  <div className="flex items-center gap-1">
                                    <button onClick={() => logStatus(sub.id, 'attended', selectedCalendarDay)} className="px-2 py-1 rounded-xl bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-[10px] font-bold">✓ Attended</button>
                                    <button onClick={() => logStatus(sub.id, 'missed', selectedCalendarDay)} className="px-2 py-1 rounded-xl bg-rose-500/20 border border-rose-500/40 text-rose-300 text-[10px] font-bold">✕ Missed</button>
                                    <button onClick={() => cancelSlotForSpecificDay(slot.id, selectedCalendarDay)} className="px-2 py-1 rounded-xl bg-slate-500/20 border border-slate-500/40 text-slate-300 text-[10px] font-bold">🗑️ Day</button>
                                  </div>
                                </div>
                              )
                            })}
                          </div>
                        )
                      })()}
                    </div>
                  </div>
                )}

                <div className="glass-card rounded-3xl p-5 sm:p-6 space-y-4">
                  <div className="flex items-center justify-between border-b border-white/10 pb-3">
                    <h2 className="text-xs font-bold uppercase tracking-widest text-indigo-400">Master Timetable Registry</h2>
                  </div>
                  {timetable.length === 0 ? <p className="text-center py-4 text-slate-500 text-xs font-medium">No slots configured.</p> : (
                    <div className="space-y-2.5 max-h-80 overflow-y-auto pr-1">
                      {timetable.map(slot => {
                        const sub = subjects.find(s => s.id === slot.subjectId);
                        if (!sub) return null;
                        return (
                          <div key={slot.id} className="flex items-center justify-between p-3 rounded-2xl bg-white/[0.02] border border-white/10">
                            <div className="flex items-center gap-2.5">
                              <span className="h-2.5 w-2.5 rounded-full" style={{ backgroundColor: sub.color || '#6366f1' }}></span>
                              <div>
                                <div className="flex items-center gap-2">
                                  <span className="font-bold text-slate-100 text-xs">{sub.name}</span>
                                  <span className="text-[10px] font-semibold text-indigo-300">({slot.day})</span>
                                  {slot.isTemporary && <span className="px-1.5 py-0.2 text-[8px] font-extrabold uppercase rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">Temporary</span>}
                                </div>
                                <p className="text-[10px] text-slate-400 mt-0.5">{slot.type} • 🕒 {slot.startTime} – {slot.endTime} {slot.isTemporary ? `• [${slot.startDate} to ${slot.endDate}]` : ''}</p>
                              </div>
                            </div>
                            <button onClick={() => setTimetable(timetable.filter(t => t.id !== slot.id))} className="px-2.5 py-1 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-[11px] font-bold">🗑️ Delete</button>
                          </div>
                        )
                      })}
                    </div>
                  )}
                </div>

                <form onSubmit={(e) => { e.preventDefault(); if(holidayName.trim() && holidayStartDate && holidayEndDate && holidayEndDate >= holidayStartDate) { setHolidays([...holidays, { id: Date.now().toString(), name: holidayName.trim(), startDate: holidayStartDate, endDate: holidayEndDate }]); setHolidayName('');} }} className="glass-card rounded-3xl p-5 sm:p-6 space-y-4">
                  <div className="flex items-center justify-between border-b border-white/10 pb-3">
                    <h2 className="text-xs font-bold uppercase tracking-widest text-amber-400">Register Holiday Period</h2>
                    <span className="text-[10px] text-slate-500 uppercase tracking-widest">Global Cancel</span>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div className="sm:col-span-1">
                      <label className="mb-1 block text-xs font-semibold text-slate-400">Holiday Name</label>
                      <input type="text" value={holidayName} onChange={(e) => setHolidayName(e.target.value)} className="glass-input w-full rounded-2xl px-3.5 py-2 text-xs font-bold text-amber-300" />
                    </div>
                    <div>
                      <label className="mb-1 block text-xs font-semibold text-slate-400">Start Date</label>
                      <input type="date" value={holidayStartDate} onChange={(e) => setHolidayStartDate(e.target.value)} className="glass-input w-full rounded-2xl px-3.5 py-2 text-xs font-bold text-amber-300 cursor-pointer" />
                    </div>
                    <div>
                      <label className="mb-1 block text-xs font-semibold text-slate-400">End Date</label>
                      <input type="date" value={holidayEndDate} onChange={(e) => setHolidayEndDate(e.target.value)} className="glass-input w-full rounded-2xl px-3.5 py-2 text-xs font-bold text-amber-300 cursor-pointer" />
                    </div>
                  </div>
                  <button type="submit" className="w-full rounded-2xl bg-amber-500/20 border border-amber-500/40 py-2.5 text-xs font-bold text-amber-300 hover:bg-amber-500/30 transition-all">+ Register Holiday Range</button>
                  {holidays.length > 0 && (
                    <div className="flex items-center gap-2 flex-wrap pt-1">
                      {holidays.map(h => (
                        <div key={h.id} className="flex items-center gap-2 px-3 py-1 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-amber-300 text-xs font-bold">
                          <span>🎉 {h.name} ({h.startDate} to {h.endDate})</span>
                          <button type="button" onClick={() => setHolidays(holidays.filter(x => x.id !== h.id))} className="text-amber-400/60 hover:text-rose-400 font-bold ml-1">✕</button>
                        </div>
                      ))}
                    </div>
                  )}
                </form>

                <form onSubmit={(e) => { e.preventDefault(); if(ttSubjectId && ttStartTime < ttEndTime && (!ttIsTemporary || ttEndDate >= ttStartDate)) { setTimetable([...timetable, { id: Date.now().toString(), day: ttDay, subjectId: ttSubjectId, type: ttType, startTime: ttStartTime, endTime: ttEndTime, isTemporary: ttIsTemporary, startDate: ttIsTemporary ? ttStartDate : null, endDate: ttIsTemporary ? ttEndDate : null }]); } }} className="glass-card rounded-3xl p-5 sm:p-6 space-y-4">
                  <div className="flex items-center justify-between border-b border-white/10 pb-3">
                    <h2 className="text-xs font-bold uppercase tracking-widest text-indigo-400">Add Class to Timetable</h2>
                  </div>
                  
                  <div className="flex items-center justify-between bg-white/[0.02] border border-white/10 rounded-2xl p-3">
                    <div>
                      <p className="text-xs font-bold text-slate-200">Temporary Schedule</p>
                      <p className="text-[10px] text-slate-400">Restrict schedule within specific dates</p>
                    </div>
                    <input type="checkbox" checked={ttIsTemporary} onChange={(e) => setTtIsTemporary(e.target.checked)} className="h-4 w-4 rounded border-white/20 bg-slate-900 text-indigo-600 focus:ring-indigo-500 cursor-pointer" />
                  </div>

                  {ttIsTemporary && (
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 p-3 rounded-2xl bg-indigo-500/10 border border-indigo-500/20">
                      <div>
                        <label className="mb-1 block text-xs font-semibold text-indigo-300">Start Date</label>
                        <input type="date" value={ttStartDate} onChange={(e) => setTtStartDate(e.target.value)} className="glass-input w-full rounded-2xl px-3.5 py-2 text-xs font-bold text-indigo-200 cursor-pointer" />
                      </div>
                      <div>
                        <label className="mb-1 block text-xs font-semibold text-indigo-300">End Date</label>
                        <input type="date" value={ttEndDate} onChange={(e) => setTtEndDate(e.target.value)} className="glass-input w-full rounded-2xl px-3.5 py-2 text-xs font-bold text-indigo-200 cursor-pointer" />
                      </div>
                    </div>
                  )}

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="mb-1 block text-xs font-semibold text-slate-400">Day</label>
                      <select value={ttDay} onChange={(e) => setTtDay(e.target.value)} className="glass-input w-full rounded-2xl px-3.5 py-2.5 text-xs font-medium">{DAYS.map(d => <option key={d} value={d} className="bg-slate-900 text-white">{d}</option>)}</select>
                    </div>
                    <div>
                      <label className="mb-1 block text-xs font-semibold text-slate-400">Subject</label>
                      <select value={ttSubjectId} onChange={(e) => setTtSubjectId(e.target.value)} className="glass-input w-full rounded-2xl px-3.5 py-2.5 text-xs font-medium">
                        <option value="" className="bg-slate-900 text-slate-400">Select Subject</option>
                        {subjects.map(s => <option key={s.id} value={s.id} className="bg-slate-900 text-white">{s.name}</option>)}
                      </select>
                    </div>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                      <label className="mb-1 block text-xs font-semibold text-slate-400">Class Type</label>
                      <select value={ttType} onChange={(e) => setTtType(e.target.value)} className="glass-input w-full rounded-2xl px-3.5 py-2.5 text-xs font-medium">
                        <option value="Lecture" className="bg-slate-900 text-white">Lecture</option>
                        <option value="Practical" className="bg-slate-900 text-white">Practical</option>
                      </select>
                    </div>
                    <div>
                      <label className="mb-1 block text-xs font-semibold text-slate-400">Start Time</label>
                      <input type="time" value={ttStartTime} onChange={(e) => setTtStartTime(e.target.value)} className="glass-input w-full rounded-2xl px-3.5 py-2 text-xs font-medium" />
                    </div>
                    <div>
                      <label className="mb-1 block text-xs font-semibold text-slate-400">End Time</label>
                      <input type="time" value={ttEndTime} onChange={(e) => setTtEndTime(e.target.value)} className="glass-input w-full rounded-2xl px-3.5 py-2 text-xs font-medium" />
                    </div>
                  </div>
                  <button type="submit" className="glow-button w-full rounded-2xl py-3 text-xs font-bold uppercase tracking-wider text-white shadow-xl shadow-indigo-500/20">Add Class Schedule</button>
                </form>
              </>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
