<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Inter', system-ui, sans-serif; 
      background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
      min-height: 100vh;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    const { useState, useEffect } = React;

    function App() {
      const [subjects, setSubjects] = useState([]);
      const [loaded, setLoaded] = useState(false);
      const [name, setName] = useState('');
      const [min, setMin] = useState('75');
      const [target, setTarget] = useState('85');
      const [attended, setAttended] = useState('0');
      const [total, setTotal] = useState('0');

      useEffect(() => {
        try {
          const saved = localStorage.getItem('attendance_subjects_v2');
          if (saved) setSubjects(JSON.parse(saved));
        } catch (e) {}
        setLoaded(true);
      }, []);

      useEffect(() => {
        if (loaded) {
          localStorage.setItem('attendance_subjects_v2', JSON.stringify(subjects));
        }
      }, [subjects, loaded]);

      const addSubject = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        const att = parseInt(attended) || 0;
        const tot = parseInt(total) || 0;
        const minPct = parseFloat(min) || 75;
        const targetPct = parseFloat(target) || 85;

        setSubjects([...subjects, {
          id: Date.now().toString(),
          name: name.trim(),
          attended: att,
          total: tot,
          min: minPct,
          target: targetPct
        }]);

        setName('');
        setAttended('0');
        setTotal('0');
      };

      const deleteSubject = (id) => {
        setSubjects(subjects.filter(s => s.id !== id));
      };

      const adjust = (id, field, delta) => {
        setSubjects(subjects.map(s => {
          if (s.id !== id) return s;
          let att = s.attended;
          let tot = s.total;
          if (field === 'att') {
            att = Math.max(0, att + delta);
            if (att > tot) tot = att;
          } else {
            tot = Math.max(0, tot + delta);
            if (att > tot) att = tot;
          }
          return { ...s, attended: att, total: tot };
        }));
      };

      if (!loaded) return React.createElement('div', { className: 'p-8 text-center text-slate-500 font-medium' }, 'Loading...');

      return React.createElement('div', { className: 'min-h-screen pb-12 text-slate-800' },
        React.createElement('header', { className: 'sticky top-0 z-10 border-b border-white/20 bg-white/60 backdrop-blur-md shadow-sm' },
          React.createElement('div', { className: 'mx-auto flex max-w-xl items-center justify-between px-5 py-4' },
            React.createElement('h1', { className: 'text-lg font-bold tracking-tight text-slate-900' }, 'Attendance Tracker')
          )
        ),
        React.createElement('main', { className: 'mx-auto max-w-xl px-4 py-6 space-y-5' },
          React.createElement('form', { onSubmit: addSubject, className: 'glass-panel rounded-3xl p-5 shadow-xl space-y-4' },
            React.createElement('h2', { className: 'text-xs font-bold uppercase tracking-wider text-slate-400' }, 'Add New Subject'),
            React.createElement('input', {
              type: 'text',
              placeholder: 'Subject Name (e.g. Pharmacology)',
              value: name,
              onChange: (e) => setName(e.target.value),
              className: 'w-full rounded-2xl border border-white/60 bg-white/50 px-4 py-3 text-sm outline-none focus:bg-white focus:ring-2 focus:ring-blue-500/30 transition-all'
            }),
            React.createElement('div', { className: 'grid grid-cols-2 gap-3' },
              React.createElement('div', null,
                React.createElement('label', { className: 'mb-1.5 block text-xs font-medium text-slate-500' }, 'Min Required %'),
                React.createElement('input', { type: 'number', value: min, onChange: (e) => setMin(e.target.value), className: 'w-full rounded-2xl border border-white/60 bg-white/50 px-4 py-2.5 text-sm outline-none focus:bg-white focus:ring-2 focus:ring-blue-500/30 transition-all' })
              ),
              React.createElement('div', null,
                React.createElement('label', { className: 'mb-1.5 block text-xs font-medium text-slate-500' }, 'Target %'),
                React.createElement('input', { type: 'number', value: target, onChange: (e) => setTarget(e.target.value), className: 'w-full rounded-2xl border border-white/60 bg-white/50 px-4 py-2.5 text-sm outline-none focus:bg-white focus:ring-2 focus:ring-blue-500/30 transition-all' })
              )
            ),
            React.createElement('div', { className: 'grid grid-cols-2 gap-3' },
              React.createElement('div', null,
                React.createElement('label', { className: 'mb-1.5 block text-xs font-medium text-slate-500' }, 'Attended'),
                React.createElement('input', { type: 'number', value: attended, onChange: (e) => setAttended(e.target.value), className: 'w-full rounded-2xl border border-white/60 bg-white/50 px-4 py-2.5 text-sm outline-none focus:bg-white focus:ring-2 focus:ring-blue-500/30 transition-all' })
              ),
              React.createElement('div', null,
                React.createElement('label', { className: 'mb-1.5 block text-xs font-medium text-slate-500' }, 'Total Held'),
                React.createElement('input', { type: 'number', value: total, onChange: (e) => setTotal(e.target.value), className: 'w-full rounded-2xl border border-white/60 bg-white/50 px-4 py-2.5 text-sm outline-none focus:bg-white focus:ring-2 focus:ring-blue-500/30 transition-all' })
              )
            ),
            React.createElement('button', {
              type: 'submit',
              className: 'w-full rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600 py-3 text-sm font-semibold text-white shadow-lg shadow-blue-500/25 hover:from-blue-500 hover:to-indigo-500 active:scale-[0.98] transition-all'
            }, 'Add Subject')
          ),
          subjects.length === 0 ? React.createElement('div', { className: 'glass-panel rounded-3xl p-12 text-center text-slate-400 font-medium' }, 'No subjects added yet.') :
          React.createElement('div', { className: 'space-y-4' },
            subjects.map(s => {
              const pct = s.total > 0 ? (s.attended / s.total) * 100 : 0;
              const formattedPct = pct.toFixed(1);
              
              let barColor = 'bg-slate-300';
              let statusText = 'No classes held';
              let statusColor = 'text-slate-400';
              let adviceText = '';

              if (s.total > 0) {
                if (pct < s.min) {
                  barColor = 'bg-rose-500';
                  statusText = 'At Risk (Below Min)';
                  statusColor = 'text-rose-500 font-semibold';
                  const needed = Math.ceil((s.min * s.total - 100 * s.attended) / (100 - s.min));
                  adviceText = `Attend next ${needed} class${needed === 1 ? '' : 'es'} to reach min (${s.min}%)`;
                } else if (pct < s.target) {
                  barColor = 'bg-amber-500';
                  statusText = 'Needs Attention (Below Target)';
                  statusColor = 'text-amber-500 font-semibold';
                  const needed = Math.ceil((s.target * s.total - 100 * s.attended) / (100 - s.target));
                  adviceText = `Attend next ${needed} class${needed === 1 ? '' : 'es'} to reach target (${s.target}%)`;
                } else {
                  barColor = 'bg-emerald-500';
                  statusText = 'On Track';
                  statusColor = 'text-emerald-500 font-semibold';
                  const bunkable = Math.floor((100 * s.attended - s.target * s.total) / s.target);
                  adviceText = bunkable > 0 ? `Can safely skip ${bunkable} class${bunkable === 1 ? '' : 'es'} while maintaining target.` : `Meeting target exactly.`;
                }
              }

              return React.createElement('div', { key: s.id, className: 'glass-panel rounded-3xl p-5 shadow-xl space-y-4 transition-all' },
                React.createElement('div', { className: 'flex items-center justify-between' },
                  React.createElement('div', null,
                    React.createElement('h3', { className: 'font-semibold text-slate-900 text-base' }, s.name),
                    React.createElement('p', { className: 'text-xs text-slate-400 mt-0.5' }, `Attended ${s.attended} of ${s.total} classes`)
                  ),
                  React.createElement('div', { className: 'text-right' },
                    React.createElement('span', { className: 'text-xl font-bold tracking-tight text-slate-900' }, `${formattedPct}%`),
                    React.createElement('div', { className: `text-xs ${statusColor}` }, statusText)
                  )
                ),
                // Progress Bar Container with markers for min and target
                React.createElement('div', { className: 'space-y-1.5' },
                  React.createElement('div', { className: 'relative h-3 w-full overflow-hidden rounded-full bg-slate-200/60 p-0.5' },
                    React.createElement('div', { className: `h-full rounded-full transition-all duration-500 ${barColor}`, style: { width: `${Math.min(pct, 100)}%` } }),
                    // Minimum marker line
                    React.createElement('div', { className: 'absolute top-0 bottom-0 w-0.5 bg-rose-700/60 z-10', style: { left: `${Math.min(s.min, 100)}%` }, title: `Min: ${s.min}%` }),
                    // Target marker line
                    React.createElement('div', { className: 'absolute top-0 bottom-0 w-0.5 bg-emerald-700/60 z-10', style: { left: `${Math.min(s.target, 100)}%` }, title: `Target: ${s.target}%` })
                  ),
                  React.createElement('div', { className: 'flex justify-between items-center text-[11px] text-slate-500 px-1' },
                    React.createElement('span', null, `Min: ${s.min}%`),
                    React.createElement('span', { className: 'font-medium text-slate-600' }, adviceText),
                    React.createElement('span', null, `Target: ${s.target}%`)
                  )
                ),
                React.createElement('div', { className: 'flex items-center justify-between pt-1' },
                  React.createElement('div', { className: 'flex items-center gap-1.5 rounded-2xl bg-white/60 border border-white/80 p-1 shadow-sm' },
                    React.createElement('button', { type: 'button', onClick: () => adjust(s.id, 'att', -1), className: 'px-3 py-1 text-xs font-bold text-slate-600 hover:bg-white rounded-xl transition-all active:scale-95' }, '-A'),
                    React.createElement('button', { type: 'button', onClick: () => adjust(s.id, 'att', 1), className: 'px-3 py-1 text-xs font-bold text-slate-600 hover:bg-white rounded-xl transition-all active:scale-95' }, '+A'),
                    React.createElement('button', { type: 'button', onClick: () => adjust(s.id, 'tot', 1), className: 'px-3 py-1 text-xs font-bold text-slate-600 hover:bg-white rounded-xl transition-all active:scale-95' }, '+T')
                  ),
                  React.createElement('button', { type: 'button', onClick: () => deleteSubject(s.id), className: 'text-xs font-semibold text-rose-500 hover:text-rose-700 transition-colors' }, 'Delete')
                )
              );
            })
          )
        )
      );
    }

    ReactDOM.render(React.createElement(App), document.getElementById('root'));
  </script>
</body>
</html>
