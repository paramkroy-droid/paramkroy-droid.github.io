<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Google Sign-In & API Client Libraries -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Attendance">

  <style>
    body { 
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; 
      background-color: #02040a;
      color: #f8fafc;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Enhanced Multidimensional Dynamic Mesh Background */
    .bg-mesh {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.6;
      animation: floatOrb 18s ease-in-out infinite alternate;
    }

    .bg-orb-1 {
      top: -10%;
      left: -10%;
      width: 55vw;
      height: 55vw;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.35) 0%, rgba(139, 92, 246, 0.15) 70%, transparent 100%);
    }

    .bg-orb-2 {
      top: 40%;
      right: -15%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.28) 0%, rgba(168, 85, 247, 0.1) 70%, transparent 100%);
      animation-delay: -6s;
    }

    .bg-orb-3 {
      bottom: -10%;
      left: 20%;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.25) 0%, rgba(59, 130, 246, 0.1) 70%, transparent 100%);
      animation-delay: -12s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, 30px) scale(1.08); }
      100% { transform: translate(-30px, 50px) scale(0.95); }
    }

    /* iOS Liquid Glass Containers */
    .glass-card {
      background: rgba(255, 255, 255, 0.035);
      backdrop-filter: blur(45px) saturate(190%);
      -webkit-backdrop-filter: blur(45px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 
        0 30px 60px -12px rgba(0, 0, 0, 0.6),
        inset 0 1px 1px 0 rgba(255, 255, 255, 0.25),
        inset 0 -1px 1px 0 rgba(0, 0, 0, 0.4);
    }

    .glass-modal {
      background: rgba(10, 15, 30, 0.78);
      backdrop-filter: blur(60px) saturate(200%);
      -webkit-backdrop-filter: blur(60px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.85);
    }

    .glass-input {
      background: rgba(2, 6, 23, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-input:focus {
      background: rgba(2, 6, 23, 0.75);
      border-color: rgba(129, 140, 248, 0.8);
      box-shadow: 0 0 25px -5px rgba(99, 102, 241, 0.4);
      outline: none;
    }

    /* Futuristic iOS Liquid Glass Progress Bar */
    .liquid-bar-track {
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    .liquid-bar-fill {
      position: relative;
      overflow: hidden;
      box-shadow: 
        0 0 15px rgba(255, 255, 255, 0.2),
        inset 0 1px 2px rgba(255, 255, 255, 0.6),
        inset 0 -1px 2px rgba(0, 0, 0, 0.4);
      transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .liquid-bar-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 45%;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.05));
      border-radius: 9999px 9999px 0 0;
    }

    .glow-button {
      position: relative;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glow-button::after {
      content: '';
      position: absolute;
      inset: -2px;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      border-radius: inherit;
      filter: blur(14px);
      opacity: 0;
      z-index: -1;
      transition: opacity 0.3s ease;
    }
    .glow-button:hover::after { opacity: 0.75; }
    .glow-button:active { transform: scale(0.98); }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #020617; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.18); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.35); }
  </style>
</head>
<body class="selection:bg-indigo-500 selection:text-white">
  <div class="bg-mesh">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>
  </div>
  <div id="root" class="relative z-10"></div>

  <script>
    const { useState, useEffect, useRef } = React;

    const GOOGLE_CLIENT_ID = "198897421694-94kplkn16lqgck3sohde39apfhdlpr25.apps.googleusercontent.com";
    const SCOPES = "https://www.googleapis.com/auth/drive.appdata";
    const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const DEFAULT_COLORS = ['#6366f1', '#ec4899', '#10b981', '#f59e0b', '#06b6d4', '#8b5cf6', '#f43f5e', '#14b8a6'];

    function App() {
      const [subjects, setSubjects] = useState([]);
      const [timetable, setTimetable] = useState([]);
      const [historyLogs, setHistoryLogs] = useState({}); // Stores date-indexed attendance records
      const [activeTab, setActiveTab] = useState('tracker');
      const [loaded, setLoaded] = useState(false);
      const [notifState, setNotifState] = useState('unknown');

      // Google Auth & Drive States
      const [accessToken, setAccessToken] = useState(null);
      const [syncing, setSyncing] = useState(false);
      const [lastSynced, setLastSynced] = useState(null);
      const tokenClientRef = useRef(null);

      // Calendar Navigation State
      const [currentMonth, setCurrentMonth] = useState(new Date());
      const [selectedCalendarDay, setSelectedCalendarDay] = useState(null);

      const [alertLeadTime, setAlertLeadTime] = useState(10);

      // Form States
      const [name, setName] = useState('');
      const [min, setMin] = useState('75');
      const [target, setTarget] = useState('85');
      const [attended, setAttended] = useState('0');
      const [total, setTotal] = useState('0');
      const [selectedColor, setSelectedColor] = useState(DEFAULT_COLORS[0]);

      const [ttDay, setTtDay] = useState('Monday');
      const [ttSubjectId, setTtSubjectId] = useState('');
      const [ttType, setTtType] = useState('Lecture');
      const [ttTime, setTtTime] = useState('09:00');

      useEffect(() => {
        try {
          const savedSubjects = localStorage.getItem('attendance_subjects_v13');
          const savedTimetable = localStorage.getItem('attendance_timetable_v13');
          const savedHistory = localStorage.getItem('attendance_history_v13');
          const savedLeadTime = localStorage.getItem('attendance_alert_lead_time');
          
          if (savedSubjects) setSubjects(JSON.parse(savedSubjects));
          if (savedTimetable) setTimetable(JSON.parse(savedTimetable));
          if (savedHistory) setHistoryLogs(JSON.parse(savedHistory));
          if (savedLeadTime) setAlertLeadTime(parseInt(savedLeadTime, 10));
        } catch (e) {}

        if ('Notification' in window) {
          setNotifState(Notification.permission);
        } else {
          setNotifState('unsupported');
        }
        setLoaded(true);

        const checkGoogleLibs = setInterval(() => {
          if (window.google && window.google.accounts) {
            clearInterval(checkGoogleLibs);
            tokenClientRef.current = window.google.accounts.oauth2.initTokenClient({
              client_id: GOOGLE_CLIENT_ID,
              scope: SCOPES,
              callback: async (resp) => {
                if (resp.access_token) {
                  setAccessToken(resp.access_token);
                  await loadFromGoogleDrive(resp.access_token);
                }
              },
            });
          }
        }, 300);

        return () => clearInterval(checkGoogleLibs);
      }, []);

      useEffect(() => {
        if (loaded) {
          localStorage.setItem('attendance_subjects_v13', JSON.stringify(subjects));
          localStorage.setItem('attendance_timetable_v13', JSON.stringify(timetable));
          localStorage.setItem('attendance_history_v13', JSON.stringify(historyLogs));
          localStorage.setItem('attendance_alert_lead_time', alertLeadTime.toString());

          if (accessToken) {
            saveToGoogleDrive(accessToken, subjects, timetable, historyLogs);
          }
        }
      }, [subjects, timetable, historyLogs, alertLeadTime, loaded]);

      const handleGoogleLogin = () => {
        if (!tokenClientRef.current) {
          alert("Google Sign-In service is initializing.");
          return;
        }
        tokenClientRef.current.requestAccessToken({ prompt: 'consent' });
      };

      const loadFromGoogleDrive = async (token) => {
        setSyncing(true);
        try {
          const queryRes = await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='attendance_data.json'", {
            headers: { Authorization: `Bearer ${token}` }
          });
          const queryData = await queryRes.json();

          if (queryData.files && queryData.files.length > 0) {
            const fileId = queryData.files[0].id;
            const contentRes = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
              headers: { Authorization: `Bearer ${token}` }
            });
            const cloudData = await contentRes.json();
            if (cloudData.subjects) setSubjects(cloudData.subjects);
            if (cloudData.timetable) setTimetable(cloudData.timetable);
            if (cloudData.historyLogs) setHistoryLogs(cloudData.historyLogs);
          }
          setLastSynced(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
        } catch (err) {
          console.error("Failed to load from Drive:", err);
        } finally {
          setSyncing(false);
        }
      };

      const saveToGoogleDrive = async (token, currentSubjects, currentTimetable, currentHistory) => {
        setSyncing(true);
        try {
          const payload = JSON.stringify({ subjects: currentSubjects, timetable: currentTimetable, historyLogs: currentHistory });
          const queryRes = await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='attendance_data.json'", {
            headers: { Authorization: `Bearer ${token}` }
          });
          const queryData = await queryRes.json();

          let fileId = null;
          if (queryData.files && queryData.files.length > 0) {
            fileId = queryData.files[0].id;
          }

          const metadata = {
            name: 'attendance_data.json',
            mimeType: 'application/json',
            ...(fileId ? {} : { parents: ['appDataFolder'] })
          };

          const form = new FormData();
          form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
          form.append('file', new Blob([payload], { type: 'application/json' }));

          const endpoint = fileId 
            ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`
            : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;

          await fetch(endpoint, {
            method: fileId ? 'PATCH' : 'POST',
            headers: { Authorization: `Bearer ${token}` },
            body: form
          });

          setLastSynced(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
        } catch (err) {
          console.error("Failed to save to Drive:", err);
        } finally {
          setSyncing(false);
        }
      };

      useEffect(() => {
        if (notifState !== 'granted' || timetable.length === 0) return;

        const interval = setInterval(() => {
          const now = new Date();
          const dayName = DAYS[now.getDay()];
          if (!dayName) return;

          const currentMinutes = now.getHours() * 60 + now.getMinutes();

          timetable.forEach(slot => {
            if (slot.day !== dayName) return;

            const [h, m] = slot.time.split(':').map(Number);
            const slotMinutes = h * 60 + m;

            if (slotMinutes - currentMinutes === alertLeadTime && now.getSeconds() < 10) {
              const subject = subjects.find(s => s.id === slot.subjectId);
              if (!subject) return;

              try {
                const notification = new Notification(`Class Alert: ${subject.name}`, {
                  body: `${slot.type} starts in ${alertLeadTime} minutes (${slot.time}). Log status now.`
                });
                notification.onclick = () => { window.focus(); };
              } catch (err) {
                console.warn('Notification error:', err);
              }
            }
          });
        }, 10000);

        return () => clearInterval(interval);
      }, [notifState, timetable, subjects, alertLeadTime]);

      const requestNotificationPermission = () => {
        if (!('Notification' in window)) {
          alert('Safari restricts Web Notifications when opened as a local file (file://). Host on HTTPS or Add to Home Screen to enable notifications.');
          return;
        }
        Notification.requestPermission().then(permission => {
          setNotifState(permission);
        });
      };

      const addSubject = (e) => {
        e.preventDefault();
        if (!name.trim()) return;

        const creationDate = new Date().toISOString().split('T')[0];

        setSubjects([...subjects, {
          id: Date.now().toString(),
          name: name.trim(),
          attended: parseInt(attended) || 0,
          total: parseInt(total) || 0,
          min: parseFloat(min) || 75,
          target: parseFloat(target) || 85,
          color: selectedColor,
          createdAt: creationDate
        }]);

        setName('');
        setAttended('0');
        setTotal('0');
        setSelectedColor(DEFAULT_COLORS[(subjects.length + 1) % DEFAULT_COLORS.length]);
      };

      const updateTargetMetric = (id, field, value) => {
        const val = parseFloat(value) || 0;
        setSubjects(subjects.map(s => {
          if (s.id !== id) return s;
          return { ...s, [field]: Math.min(100, Math.max(0, val)) };
        }));
      };

      const deleteSubject = (id) => {
        setSubjects(subjects.filter(s => s.id !== id));
        setTimetable(timetable.filter(t => t.subjectId !== id));
      };

      // Deletes all scheduled timetable entries for a specific subject
      const deleteSubjectTimetableGroup = (subjectId) => {
        setTimetable(timetable.filter(t => t.subjectId !== subjectId));
      };

      const logStatus = (subjectId, action, targetDate) => {
        const dateKey = targetDate ? new Date(targetDate).toISOString().split('T')[0] : new Date().toISOString().split('T')[0];

        // Update Overall Subject Class Counters
        setSubjects(subjects.map(s => {
          if (s.id !== subjectId) return s;
          let att = s.attended;
          let tot = s.total;

          if (action === 'attended') {
            att += 1;
            tot += 1;
          } else if (action === 'missed') {
            tot += 1;
          } else if (action === 'cancelled') {
            if (tot > 0) {
              tot -= 1;
              if (att > tot) att = tot;
            }
          }
          return { ...s, attended: Math.max(0, att), total: Math.max(0, tot) };
        }));

        // Store Action Record into History Logs
        setHistoryLogs(prev => {
          const dayRecords = prev[dateKey] || [];
          const existingIndex = dayRecords.findIndex(r => r.subjectId === subjectId);
          
          let updatedDayRecords = [...dayRecords];
          if (existingIndex >= 0) {
            updatedDayRecords[existingIndex] = { subjectId, status: action };
          } else {
            updatedDayRecords.push({ subjectId, status: action });
          }

          return { ...prev, [dateKey]: updatedDayRecords };
        });
      };

      const addTimetableSlot = (e) => {
        e.preventDefault();
        if (!ttSubjectId) return;

        setTimetable([...timetable, {
          id: Date.now().toString(),
          day: ttDay,
          subjectId: ttSubjectId,
          type: ttType,
          time: ttTime
        }]);
      };

      const deleteTimetableSlot = (id) => {
        setTimetable(timetable.filter(t => t.id !== id));
      };

      const getCalendarDays = () => {
        const year = currentMonth.getFullYear();
        const month = currentMonth.getMonth();
        const firstDayOfMonth = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        const days = [];
        for (let i = 0; i < firstDayOfMonth; i++) {
          days.push(null);
        }
        for (let d = 1; d <= daysInMonth; d++) {
          days.push(new Date(year, month, d));
        }
        return days;
      };

      if (!loaded) return React.createElement('div', { className: 'p-12 text-center text-slate-500 font-medium tracking-wide' }, 'Loading...');

      return React.createElement('div', { className: 'min-h-screen pb-24 text-slate-100' },
        
        // Header
        React.createElement('header', { className: 'sticky top-0 z-30 border-b border-white/10 bg-slate-950/20 backdrop-blur-3xl shadow-2xl' },
          React.createElement('div', { className: 'mx-auto flex max-w-3xl items-center justify-between px-6 py-4' },
            React.createElement('h1', { className: 'text-base font-bold tracking-wide text-white/90' }, 'Attendance Tracker'),

            React.createElement('div', { className: 'flex items-center gap-3' },
              accessToken ? 
              React.createElement('div', { className: 'flex items-center gap-2 px-3 py-1.5 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-300 text-xs font-semibold' },
                React.createElement('span', { className: 'h-2 w-2 rounded-full bg-emerald-400 animate-pulse' }),
                React.createElement('span', null, syncing ? 'Syncing...' : lastSynced ? `Drive Synced (${lastSynced})` : 'Drive Connected')
              ) :
              React.createElement('button', {
                onClick: handleGoogleLogin,
                className: 'px-3.5 py-1.5 rounded-2xl bg-white/10 border border-white/15 text-xs font-bold text-white hover:bg-white/20 transition-all flex items-center gap-2'
              }, 
                React.createElement('span', null, '☁️'),
                React.createElement('span', null, 'Sync with Drive')
              ),

              React.createElement('div', { className: 'flex gap-1 bg-white/[0.03] p-1 rounded-2xl border border-white/10' },
                React.createElement('button', {
                  onClick: () => setActiveTab('tracker'),
                  className: `px-4 py-1.5 rounded-xl text-xs font-semibold tracking-wide transition-all ${activeTab === 'tracker' ? 'bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-lg shadow-indigo-500/25' : 'text-slate-400 hover:text-white'}`
                }, 'Analytics'),
                React.createElement('button', {
                  onClick: () => setActiveTab('timetable'),
                  className: `px-4 py-1.5 rounded-xl text-xs font-semibold tracking-wide transition-all ${activeTab === 'timetable' ? 'bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-lg shadow-indigo-500/25' : 'text-slate-400 hover:text-white'}`
                }, 'Schedule')
              )
            )
          )
        ),

        React.createElement('main', { className: 'mx-auto max-w-3xl px-4 py-8 space-y-8' },
          
          // GLOBAL NOTIFICATION CONFIG BAR
          React.createElement('div', { className: 'glass-card rounded-3xl p-4 px-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4' },
            React.createElement('div', { className: 'flex items-center gap-3' },
              React.createElement('div', { className: `p-2.5 rounded-2xl ${notifState === 'granted' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'}` },
                notifState === 'granted' ? '🔔' : '🔕'
              ),
              React.createElement('div', null,
                React.createElement('h4', { className: 'text-xs font-bold uppercase tracking-wider text-slate-200' }, 'Pre-Lecture Notifications'),
                React.createElement('p', { className: 'text-xs text-slate-400' }, 
                  notifState === 'granted' ? 'Alerts active before scheduled classes' :
                  notifState === 'denied' ? 'Permission blocked in browser settings' :
                  notifState === 'unsupported' ? 'Safari requires HTTPS or Home Screen App mode for notifications' :
                  'Click enable to activate class alerts'
                )
              )
            ),
            React.createElement('div', { className: 'flex items-center gap-3 w-full sm:w-auto justify-end' },
              React.createElement('div', { className: 'flex items-center gap-2 bg-black/40 px-3 py-1.5 rounded-2xl border border-white/10' },
                React.createElement('span', { className: 'text-[11px] font-semibold text-slate-400' }, 'Lead Time:'),
                React.createElement('select', {
                  value: alertLeadTime,
                  onChange: (e) => setAlertLeadTime(parseInt(e.target.value, 10)),
                  className: 'bg-transparent text-xs font-bold text-indigo-300 outline-none cursor-pointer'
                },
                  React.createElement('option', { value: 5, className: 'bg-slate-900 text-white' }, '5 min before'),
                  React.createElement('option', { value: 10, className: 'bg-slate-900 text-white' }, '10 min before'),
                  React.createElement('option', { value: 15, className: 'bg-slate-900 text-white' }, '15 min before'),
                  React.createElement('option', { value: 30, className: 'bg-slate-900 text-white' }, '30 min before'),
                  React.createElement('option', { value: 60, className: 'bg-slate-900 text-white' }, '1 hour before')
                )
              ),
              notifState !== 'granted' && React.createElement('button', {
                onClick: requestNotificationPermission,
                className: 'px-4 py-2 rounded-2xl bg-indigo-600/30 border border-indigo-500/40 text-indigo-200 text-xs font-semibold hover:bg-indigo-600/50 transition-all'
              }, 'Enable Alerts')
            )
          ),

          // TAB 1: SUBJECT TRACKER
          activeTab === 'tracker' && React.createElement(React.Fragment, null,
            React.createElement('form', { onSubmit: addSubject, className: 'glass-card rounded-3xl p-6 sm:p-8 space-y-5' },
              React.createElement('div', { className: 'flex items-center justify-between border-b border-white/10 pb-3' },
                React.createElement('h2', { className: 'text-xs font-bold uppercase tracking-widest text-indigo-400' }, 'Add Subject'),
                React.createElement('span', { className: 'text-[10px] text-slate-500 uppercase tracking-widest' }, 'Real-time Stats')
              ),
              React.createElement('input', {
                type: 'text',
                placeholder: 'Subject Name (e.g. Pharmacology)',
                value: name,
                onChange: (e) => setName(e.target.value),
                className: 'glass-input w-full rounded-2xl px-5 py-3.5 text-sm font-medium focus:ring-2 focus:ring-indigo-500/50'
              }),
              
              React.createElement('div', { className: 'space-y-2' },
                React.createElement('label', { className: 'block text-xs font-semibold text-slate-400' }, 'Assign Theme Color'),
                React.createElement('div', { className: 'flex items-center gap-2.5 flex-wrap' },
                  DEFAULT_COLORS.map(c => React.createElement('button', {
                    key: c,
                    type: 'button',
                    onClick: () => setSelectedColor(c),
                    className: `h-7 w-7 rounded-full transition-transform ${selectedColor === c ? 'scale-125 ring-2 ring-white shadow-lg' : 'opacity-70 hover:opacity-100'}`,
                    style: { backgroundColor: c }
                  }))
                )
              ),
