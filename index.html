<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; 
      background-color: #020617;
      color: #f8fafc;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Ambient Glow Effects */
    .mesh-glow {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: 
        radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.25) 0%, transparent 45%),
        radial-gradient(circle at 85% 20%, rgba(168, 85, 247, 0.2) 0%, transparent 40%),
        radial-gradient(circle at 50% 85%, rgba(14, 165, 233, 0.2) 0%, transparent 50%);
      filter: blur(80px);
      animation: meshPulse 14s ease-in-out infinite alternate;
    }
    @keyframes meshPulse {
      0% { opacity: 0.8; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.08); }
    }

    /* Transparent Liquid Glass Glassmorphism */
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 
        0 30px 60px -12px rgba(0, 0, 0, 0.5),
        inset 0 1px 1px 0 rgba(255, 255, 255, 0.18);
    }
    .glass-card:hover {
      border-color: rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.05);
    }

    .glass-input {
      background: rgba(2, 6, 23, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-input:focus {
      background: rgba(2, 6, 23, 0.7);
      border-color: rgba(129, 140, 248, 0.8);
      box-shadow: 0 0 25px -5px rgba(99, 102, 241, 0.35);
      outline: none;
    }

    .glow-button {
      position: relative;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glow-button::after {
      content: '';
      position: absolute;
      inset: -2px;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      border-radius: inherit;
      filter: blur(14px);
      opacity: 0;
      z-index: -1;
      transition: opacity 0.3s ease;
    }
    .glow-button:hover::after { opacity: 0.75; }
    .glow-button:active { transform: scale(0.98); }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #020617; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.18); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.35); }
  </style>
</head>
<body class="selection:bg-indigo-500 selection:text-white">
  <div class="mesh-glow"></div>
  <div id="root" class="relative z-10"></div>

  <script>
    const { useState, useEffect } = React;

    const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

    function App() {
      const [subjects, setSubjects] = useState([]);
      const [timetable, setTimetable] = useState([]);
      const [activeTab, setActiveTab] = useState('tracker');
      const [loaded, setLoaded] = useState(false);
      const [notifState, setNotifState] = useState('unknown');

      // Selected Calendar Date
      const [selectedDate, setSelectedDate] = useState(() => new Date().toISOString().split('T')[0]);

      // Notification Lead Time (in minutes)
      const [alertLeadTime, setAlertLeadTime] = useState(10);

      // New Subject Form State
      const [name, setName] = useState('');
      const [min, setMin] = useState('75');
      const [target, setTarget] = useState('85');
      const [attended, setAttended] = useState('0');
      const [total, setTotal] = useState('0');

      // Timetable Entry Form State
      const [ttDay, setTtDay] = useState('Monday');
      const [ttSubjectId, setTtSubjectId] = useState('');
      const [ttType, setTtType] = useState('Lecture');
      const [ttTime, setTtTime] = useState('09:00');

      useEffect(() => {
        try {
          const savedSubjects = localStorage.getItem('attendance_subjects_v9');
          const savedTimetable = localStorage.getItem('attendance_timetable_v9');
          const savedLeadTime = localStorage.getItem('attendance_alert_lead_time');
          
          if (savedSubjects) setSubjects(JSON.parse(savedSubjects));
          if (savedTimetable) setTimetable(JSON.parse(savedTimetable));
          if (savedLeadTime) setAlertLeadTime(parseInt(savedLeadTime, 10));
        } catch (e) {}

        if ('Notification' in window) {
          setNotifState(Notification.permission);
        } else {
          setNotifState('unsupported');
        }
        setLoaded(true);
      }, []);

      useEffect(() => {
        if (loaded) {
          localStorage.setItem('attendance_subjects_v9', JSON.stringify(subjects));
          localStorage.setItem('attendance_timetable_v9', JSON.stringify(timetable));
          localStorage.setItem('attendance_alert_lead_time', alertLeadTime.toString());
        }
      }, [subjects, timetable, alertLeadTime, loaded]);

      // Pre-Class Alert Loop
      useEffect(() => {
        if (notifState !== 'granted' || timetable.length === 0) return;

        const interval = setInterval(() => {
          const now = new Date();
          const dayName = DAYS[now.getDay()];
          if (!dayName) return;

          const currentMinutes = now.getHours() * 60 + now.getMinutes();

          timetable.forEach(slot => {
            if (slot.day !== dayName) return;

            const [h, m] = slot.time.split(':').map(Number);
            const slotMinutes = h * 60 + m;

            if (slotMinutes - currentMinutes === alertLeadTime && now.getSeconds() < 10) {
              const subject = subjects.find(s => s.id === slot.subjectId);
              if (!subject) return;

              try {
                const notification = new Notification(`Class Alert: ${subject.name}`, {
                  body: `${slot.type} starts in ${alertLeadTime} minutes (${slot.time}). Log status now.`
                });
                notification.onclick = () => { window.focus(); };
              } catch (err) {
                console.warn('Notification error:', err);
              }
            }
          });
        }, 10000);

        return () => clearInterval(interval);
      }, [notifState, timetable, subjects, alertLeadTime]);

      const requestNotificationPermission = () => {
        if (!('Notification' in window)) {
          alert('Notifications are restricted by your browser environment or connection setup.');
          return;
        }
        Notification.requestPermission().then(permission => {
          setNotifState(permission);
          if (permission === 'granted') {
            new Notification("Class Alerts Enabled", {
              body: "Reminders active for your upcoming classes."
            });
          }
        }).catch(() => {
          alert('Failed to request notification permission.');
        });
      };

      const addSubject = (e) => {
        e.preventDefault();
        if (!name.trim()) return;

        setSubjects([...subjects, {
          id: Date.now().toString(),
          name: name.trim(),
          attended: parseInt(attended) || 0,
          total: parseInt(total) || 0,
          min: parseFloat(min) || 75,
          target: parseFloat(target) || 85
        }]);

        setName('');
        setAttended('0');
        setTotal('0');
      };

      const deleteSubject = (id) => {
        setSubjects(subjects.filter(s => s.id !== id));
        setTimetable(timetable.filter(t => t.subjectId !== id));
      };

      const logStatus = (subjectId, action) => {
        setSubjects(subjects.map(s => {
          if (s.id !== subjectId) return s;
          let att = s.attended;
          let tot = s.total;

          if (action === 'attended') {
            att += 1;
            tot += 1;
          } else if (action === 'missed') {
            tot += 1;
          } else if (action === 'cancelled') {
            if (tot > 0) {
              tot -= 1;
              if (att > tot) att = tot;
            }
          }
          return { ...s, attended: Math.max(0, att), total: Math.max(0, tot) };
        }));
      };

      const addTimetableSlot = (e) => {
        e.preventDefault();
        if (!ttSubjectId) return;

        setTimetable([...timetable, {
          id: Date.now().toString(),
          day: ttDay,
          subjectId: ttSubjectId,
          type: ttType,
          time: ttTime
        }]);
      };

      const deleteTimetableSlot = (id) => {
        setTimetable(timetable.filter(t => t.id !== id));
      };

      // Calendar Calculations
      const selectedDayName = DAYS[new Date(selectedDate + 'T00:00:00').getDay()];
      const activeCalendarSlots = timetable.filter(t => t.day === selectedDayName);

      if (!loaded) return React.createElement('div', { className: 'p-12 text-center text-slate-500 font-medium tracking-wide' }, 'Loading...');

      return React.createElement('div', { className: 'min-h-screen pb-24 text-slate-100' },
        
        // Navigation Header (No Branding / Logos)
        React.createElement('header', { className: 'sticky top-0 z-30 border-b border-white/10 bg-slate-950/20 backdrop-blur-3xl shadow-2xl' },
          React.createElement('div', { className: 'mx-auto flex max-w-3xl items-center justify-between px-6 py-4' },
            React.createElement('h1', { className: 'text-base font-bold tracking-wide text-white/90' }, 'Attendance Tracker'),

            React.createElement('div', { className: 'flex items-center gap-3' },
              React.createElement('div', { className: 'flex gap-1 bg-white/[0.03] p-1 rounded-2xl border border-white/10' },
                React.createElement('button', {
                  onClick: () => setActiveTab('tracker'),
                  className: `px-4 py-1.5 rounded-xl text-xs font-semibold tracking-wide transition-all ${activeTab === 'tracker' ? 'bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-lg shadow-indigo-500/25' : 'text-slate-400 hover:text-white'}`
                }, 'Analytics'),
                React.createElement('button', {
                  onClick: () => setActiveTab('timetable'),
                  className: `px-4 py-1.5 rounded-xl text-xs font-semibold tracking-wide transition-all ${activeTab === 'timetable' ? 'bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-lg shadow-indigo-500/25' : 'text-slate-400 hover:text-white'}`
                }, 'Schedule')
              )
            )
          )
        ),

        React.createElement('main', { className: 'mx-auto max-w-3xl px-4 py-8 space-y-8' },
          
          // GLOBAL NOTIFICATION CONFIG BAR
          React.createElement('div', { className: 'glass-card rounded-3xl p-4 px-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4' },
            React.createElement('div', { className: 'flex items-center gap-3' },
              React.createElement('div', { className: `p-2.5 rounded-2xl ${notifState === 'granted' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'}` },
                notifState === 'granted' ? '🔔' : '🔕'
              ),
              React.createElement('div', null,
                React.createElement('h4', { className: 'text-xs font-bold uppercase tracking-wider text-slate-200' }, 'Pre-Lecture Notifications'),
                React.createElement('p', { className: 'text-xs text-slate-400' }, 
                  notifState === 'granted' ? 'Alerts active before scheduled classes' :
                  notifState === 'denied' ? 'Permission blocked in browser settings' :
                  notifState === 'unsupported' ? 'Notifications restricted on unsecure or local origin' :
                  'Click enable to activate class alerts'
                )
              )
            ),
            React.createElement('div', { className: 'flex items-center gap-3 w-full sm:w-auto justify-end' },
              React.createElement('div', { className: 'flex items-center gap-2 bg-black/40 px-3 py-1.5 rounded-2xl border border-white/10' },
                React.createElement('span', { className: 'text-[11px] font-semibold text-slate-400' }, 'Lead Time:'),
                React.createElement('select', {
                  value: alertLeadTime,
                  onChange: (e) => setAlertLeadTime(parseInt(e.target.value, 10)),
                  className: 'bg-transparent text-xs font-bold text-indigo-300 outline-none cursor-pointer'
                },
                  React.createElement('option', { value: 5, className: 'bg-slate-900 text-white' }, '5 min before'),
                  React.createElement('option', { value: 10, className: 'bg-slate-900 text-white' }, '10 min before'),
                  React.createElement('option', { value: 15, className: 'bg-slate-900 text-white' }, '15 min before'),
                  React.createElement('option', { value: 30, className: 'bg-slate-900 text-white' }, '30 min before'),
                  React.createElement('option', { value: 60, className: 'bg-slate-900 text-white' }, '1 hour before')
                )
              ),
              notifState !== 'granted' && React.createElement('button', {
                onClick: requestNotificationPermission,
                className: 'px-4 py-2 rounded-2xl bg-indigo-600/30 border border-indigo-500/40 text-indigo-200 text-xs font-semibold hover:bg-indigo-600/50 transition-all'
              }, 'Enable Alerts')
            )
          ),

          // TAB 1: SUBJECT TRACKER
          activeTab === 'tracker' && React.createElement(React.Fragment, null,
            // Add Subject Form
            React.createElement('form', { onSubmit: addSubject, className: 'glass-card rounded-3xl p-6 sm:p-8 space-y-5' },
              React.createElement('div', { className: 'flex items-center justify-between border-b border-white/10 pb-3' },
                React.createElement('h2', { className: 'text-xs font-bold uppercase tracking-widest text-indigo-400' }, 'Add Subject'),
                React.createElement('span', { className: 'text-[10px] text-slate-500 uppercase tracking-widest' }, 'Real-time Stats')
              ),
              React.createElement('input', {
                type: 'text',
                placeholder: 'Subject Name (e.g. Pharmacology)',
                value: name,
                onChange: (e) => setName(e.target.value),
                className: 'glass-input w-full rounded-2xl px-5 py-3.5 text-sm font-medium focus:ring-2 focus:ring-indigo-500/50'
              }),
              React.createElement('div', { className: 'grid grid-cols-2 gap-4' },
                React.createElement('div', null,
                  React.createElement('label', { className: 'mb-1.5 block text-xs font-semibold text-slate-400' }, 'Min Required %'),
                  React.createElement('input', { type: 'number', value: min, onChange: (e) => setMin(e.target.value), className: 'glass-input w-full rounded-2xl px-4 py-2.5 text-sm font-medium' })
                ),
                React.createElement('div', null,
                  React.createElement('label', { className: 'mb-1.5 block text-xs font-semibold text-slate-400' }, 'Target %'),
                  React.createElement('input', { type: 'number', value: target, onChange: (e) => setTarget(e.target.value), className: 'glass-input w-full rounded-2xl px-4 py-2.5 text-sm font-medium' })
                )
              ),
              React.createElement('div', { className: 'grid grid-cols-2 gap-4' },
                React.createElement('div', null,
                  React.createElement('label', { className: 'mb-1.5 block text-xs font-semibold text-slate-400' }, 'Attended Classes'),
                  React.createElement('input', { type: 'number', value: attended, onChange: (e) => setAttended(e.target.value), className: 'glass-input w-full rounded-2xl px-4 py-2.5 text-sm font-medium' })
                ),
                React.createElement('div', null,
                  React.createElement('label', { className: 'mb-1.5 block text-xs font-semibold text-slate-400' }, 'Total Held Classes'),
                  React.createElement('input', { type: 'number', value: total, onChange: (e) => setTotal(e.target.value), className: 'glass-input w-full rounded-2xl px-4 py-2.5 text-sm font-medium' })
                )
              ),
              React.createElement('button', {
                type: 'submit',
                className: 'glow-button w-full rounded-2xl py-3.5 text-xs font-bold uppercase tracking-wider text-white shadow-xl shadow-indigo-500/20'
              }, 'Add Subject')
            ),

            // Subject Cards List
            subjects.length === 0 ? React.createElement('div', { className: 'glass-card rounded-3xl p-16 text-center text-slate-500 font-medium' }, 'No subjects added yet.') :
            React.createElement('div', { className: 'space-y-5' },
              subjects.map(s => {
                const pct = s.total > 0 ? (s.attended / s.total) * 100 : 0;
                const formattedPct = pct.toFixed(1);
                
                let barColor = 'bg-slate-600';
                let statusText = 'No Classes';
                let statusColor = 'text-slate-400';
                let adviceText = '';

                if (s.total > 0) {
                  if (pct < s.min) {
                    barColor = 'bg-gradient-to-r from-rose-600 to-red-500';
                    statusText = 'Below Minimum';
                    statusColor = 'text-rose-400 font-bold';
                    const needed = Math.ceil((s.min * s.total - 100 * s.attended) / (100 - s.min));
                    adviceText = `Attend next ${needed} class${needed === 1 ? '' : 'es'} to reach min (${s.min}%)`;
                  } else if (pct < s.target) {
                    barColor = 'bg-gradient-to-r from-amber-500 to-orange-400';
                    statusText = 'Below Target';
                    statusColor = 'text-amber-400 font-bold';
                    const needed = Math.ceil((s.target * s.total - 100 * s.attended) / (100 - s.target));
                    adviceText = `Attend next ${needed} class${needed === 1 ? '' : 'es'} to hit target (${s.target}%)`;
                  } else {
                    barColor = 'bg-gradient-to-r from-emerald-400 via-teal-400 to-cyan-400';
                    statusText = 'On Track';
                    statusColor = 'text-emerald-400 font-bold';
                    const bunkable = Math.floor((100 * s.attended - s.target * s.total) / s.target);
                    adviceText = bunkable > 0 ? `Can safely skip ${bunkable} class${bunkable === 1 ? '' : 'es'}.` : `At target threshold.`;
                  }
                }

                return React.createElement('div', { key: s.id, className: 'glass-card rounded-3xl p-6 space-y-5 transition-all duration-300' },
                  React.createElement('div', { className: 'flex items-center justify-between' },
                    React.createElement('div', null,
                      React.createElement('h3', { className: 'font-bold text-white text-lg tracking-tight' }, s.name),
                      React.createElement('p', { className: 'text-xs text-slate-400 mt-0.5' }, `Attended ${s.attended} of ${s.total} classes`)
                    ),
                    React.createElement('div', { className: 'text-right' },
                      React.createElement('span', { className: 'text-2xl font-black tracking-tight text-white' }, `${formattedPct}%`),
                      React.createElement('div', { className: `text-[11px] uppercase tracking-wider ${statusColor}` }, statusText)
                    )
                  ),
                  
                  // Visual Bar Matrix
                  React.createElement('div', { className: 'space-y-2' },
                    React.createElement('div', { className: 'relative h-3.5 w-full overflow-hidden rounded-full bg-black/60 p-0.5 border border-white/10 shadow-inner' },
                      React.createElement('div', { className: `h-full rounded-full transition-all duration-700 ${barColor}`, style: { width: `${Math.min(pct, 100)}%` } }),
                      React.createElement('div', { className: 'absolute top-0 bottom-0 w-0.5 bg-rose-500 z-10 shadow-[0_0_8px_#f43f5e]', style: { left: `${Math.min(s.min, 100)}%` }, title: `Min Requirement: ${s.min}%` }),
                      React.createElement('div', { className: 'absolute top-0 bottom-0 w-0.5 bg-emerald-400 z-10 shadow-[0_0_8px_#34d399]', style: { left: `${Math.min(s.target, 100)}%` }, title: `Target: ${s.target}%` })
                    ),
                    React.createElement('div', { className: 'flex justify-between items-center text-[11px] text-slate-400 font-medium px-1' },
                      React.createElement('span', null, `Min: ${s.min}%`),
                      React.createElement('span', { className: 'font-semibold text-slate-300' }, adviceText),
                      React.createElement('span', null, `Target: ${s.target}%`)
                    )
                  ),

                  // Actions
                  React.createElement('div', { className: 'flex flex-wrap items-center justify-between gap-2.5 pt-3 border-t border-white/10' },
                    React.createElement('div', { className: 'flex flex-wrap items-center gap-2.5' },
                      React.createElement('button', {
                        onClick: () => logStatus(s.id, 'attended'),
                        className: 'px-4 py-2 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 text-xs font-bold hover:bg-emerald-500/20 active:scale-95 transition-all shadow-lg shadow-emerald-500/5'
                      }, '✓ Attended'),
                      React.createElement('button', {
                        onClick: () => logStatus(s.id, 'missed'),
                        className: 'px-4 py-2 rounded-2xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs font-bold hover:bg-rose-500/20 active:scale-95 transition-all shadow-lg shadow-rose-500/5'
                      }, '✕ Missed'),
                      React.createElement('button', {
                        onClick: () => logStatus(s.id, 'cancelled'),
                        className: 'px-4 py-2 rounded-2xl bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs font-bold hover:bg-amber-500/20 active:scale-95 transition-all shadow-lg shadow-amber-500/5'
                      }, '🚫 Cancelled')
                    ),
                    React.createElement('button', {
                      type: 'button',
                      onClick: () => deleteSubject(s.id),
                      className: 'px-4 py-2 rounded-2xl bg-slate-500/10 border border-slate-500/30 text-slate-400 text-xs font-bold hover:bg-rose-500/20 hover:border-rose-500/40 hover:text-rose-300 active:scale-95 transition-all shadow-lg'
                    }, '🗑️ Delete')
                  )
                );
              })
            )
          ),

          // TAB 2: TIMETABLE & DAILY CALENDAR
          activeTab === 'timetable' && React.createElement(React.Fragment, null,
            
            // Interactive Daily Calendar View
            React.createElement('div', { className: 'glass-card rounded-3xl p-6 sm:p-8 space-y-6' },
              React.createElement('div', { className: 'flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-white/10 pb-4' },
                React.createElement('div', null,
                  React.createElement('h2', { className: 'text-xs font-bold uppercase tracking-widest text-indigo-400' }, 'Daily Schedule Calendar'),
                  React.createElement('p', { className: 'text-xs text-slate-400 mt-0.5' }, `Day: ${selectedDayName}`)
                ),
                React.createElement('input', {
                  type: 'date',
                  value: selectedDate,
                  onChange: (e) => setSelectedDate(e.target.value),
                  className: 'glass-input rounded-2xl px-4 py-2 text-xs font-bold text-indigo-300 cursor-pointer'
                })
              ),

              // Scheduled classes
              activeCalendarSlots.length === 0 ? 
              React.createElement('div', { className: 'text-center py-8 text-slate-500 text-xs font-medium' }, `No classes scheduled for ${selectedDayName}.`) :
              React.createElement('div', { className: 'space-y-3' },
                activeCalendarSlots.map(slot => {
                  const subject = subjects.find(s => s.id === slot.subjectId);
                  if (!subject) return null;

                  return React.createElement('div', { key: slot.id, className: 'flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white/[0.02] border border-white/10 rounded-2xl p-4 hover:border-white/20 transition-all' },
                    React.createElement('div', null,
                      React.createElement('div', { className: 'flex items-center gap-2.5' },
                        React.createElement('span', { className: 'font-bold text-slate-100 text-base' }, subject.name),
                        React.createElement('span', { className: `px-2.5 py-0.5 text-[10px] font-extrabold uppercase tracking-wider rounded-full ${slot.type === 'Practical' ? 'bg-purple-500/20 text-purple-300 border border-purple-500/30' : 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/30'}` }, slot.type)
                      ),
                      React.createElement('p', { className: 'text-xs text-slate-400 mt-1 font-medium' }, `Start Time: ${slot.time}`)
                    ),
                    React.createElement('div', { className: 'flex flex-wrap items-center justify-between sm:justify-end gap-2 pt-2 sm:pt-0 border-t sm:border-t-0 border-white/10' },
                      React.createElement('button', {
                        onClick: () => logStatus(subject.id, 'attended'),
                        className: 'px-3 py-1.5 rounded-2xl bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-xs font-bold hover:bg-emerald-500/30 active:scale-95 transition-all'
                      }, '✓ Attended'),
                      React.createElement('button', {
                        onClick: () => logStatus(subject.id, 'missed'),
                        className: 'px-3 py-1.5 rounded-2xl bg-rose-500/20 border border-rose-500/40 text-rose-300 text-xs font-bold hover:bg-rose-500/30 active:scale-95 transition-all'
                      }, '✕ Missed'),
                      React.createElement('button', {
                        onClick: () => logStatus(subject.id, 'cancelled'),
                        className: 'px-3 py-1.5 rounded-2xl bg-amber-500/20 border border-amber-500/40 text-amber-300 text-xs font-bold hover:bg-amber-500/30 active:scale-95 transition-all'
                      }, '🚫 Cancelled'),
                      React.createElement('button', {
                        onClick: () => deleteTimetableSlot(slot.id),
                        className: 'px-3 py-1.5 rounded-2xl bg-slate-500/20 border border-slate-500/40 text-slate-300 text-xs font-bold hover:bg-rose-500/30 hover:text-rose-300 active:scale-95 transition-all'
                      }, '🗑️ Delete')
                    )
                  );
                })
              )
            ),

            // Add Schedule Slot Form
            React.createElement('form', { onSubmit: addTimetableSlot, className: 'glass-card rounded-3xl p-6 sm:p-8 space-y-5' },
              React.createElement('div', { className: 'flex items-center justify-between border-b border-white/10 pb-3' },
                React.createElement('h2', { className: 'text-xs font-bold uppercase tracking-widest text-indigo-400' }, 'Add Class to Timetable'),
                React.createElement('span', { className: 'text-[10px] text-slate-500 uppercase tracking-widest' }, 'Schedule Matrix')
              ),
              React.createElement('div', { className: 'grid grid-cols-2 gap-4' },
                React.createElement('div', null,
                  React.createElement('label', { className: 'mb-1.5 block text-xs font-semibold text-slate-400' }, 'Day'),
                  React.createElement('select', {
                    value: ttDay,
                    onChange: (e) => setTtDay(e.target.value),
                    className: 'glass-input w-full rounded-2xl px-4 py-3 text-sm font-medium'
                  }, DAYS.map(d => React.createElement('option', { key: d, value: d, className: 'bg-slate-900 text-white' }, d)))
                ),
                React.createElement('div', null,
                  React.createElement('label', { className: 'mb-1.5 block text-xs font-semibold text-slate-400' }, 'Subject'),
                  React.createElement('select', {
                    value: ttSubjectId,
                    onChange: (e) => setTtSubjectId(e.target.value),
                    className: 'glass-input w-full rounded-2xl px-4 py-3 text-sm font-medium'
                  }, 
                    React.createElement('option', { value: '', className: 'bg-slate-900 text-slate-400' }, 'Select Subject'),
                    subjects.map(s => React.createElement('option', { key: s.id, value: s.id, className: 'bg-slate-900 text-white' }, s.name))
                  )
                )
              ),
              React.createElement('div', { className: 'grid grid-cols-2 gap-4' },
                React.createElement('div', null,
                  React.createElement('label', { className: 'mb-1.5 block text-xs font-semibold text-slate-400' }, 'Class Type'),
                  React.createElement('select', {
                    value: ttType,
                    onChange: (e) => setTtType(e.target.value),
                    className: 'glass-input w-full rounded-2xl px-4 py-3 text-sm font-medium'
                  },
                    React.createElement('option', { value: 'Lecture', className: 'bg-slate-900 text-white' }, 'Lecture'),
                    React.createElement('option', { value: 'Practical', className: 'bg-slate-900 text-white' }, 'Practical')
                  )
                ),
                React.createElement('div', null,
                  React.createElement('label', { className: 'mb-1.5 block text-xs font-semibold text-slate-400' }, 'Start Time'),
                  React.createElement('input', {
                    type: 'time',
                    value: ttTime,
                    onChange: (e) => setTtTime(e.target.value),
                    className: 'glass-input w-full rounded-2xl px-4 py-2.5 text-sm font-medium'
                  })
                )
              ),
              React.createElement('button', {
                type: 'submit',
                className: 'glow-button w-full rounded-2xl py-3.5 text-xs font-bold uppercase tracking-wider text-white shadow-xl shadow-indigo-500/20'
              }, 'Add Class Schedule')
            )
          )
        )
      );
    }

    ReactDOM.render(React.createElement(App), document.getElementById('root'));
  </script>
</body>
</html>
